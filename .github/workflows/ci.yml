name: ci

# Checks every push and pull request. No job calls AWS or Anthropic: tests use fakes and mocks, `cdk synth`
# runs against a placeholder account, and the only network use is installing packages and the browser.
on:
  push:
  pull_request:
  workflow_dispatch:

# The jobs only read the repository.
permissions:
  contents: read

# A newer push to the same branch makes an older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      # Actions are pinned to commits, not tags, because a tag can be moved. Update with
      # `gh api repos/<owner>/<repo>/git/ref/tags/<tag> --jq .object.sha`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      # Includes the test that fails when openapi.json is stale (`uv run export-openapi` regenerates it).
      - run: uv run pytest -q
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      # The /evals pages are built from frontend/src/data/evals, exported from the sets and reports. A stale or
      # missing file fails here (`uv run eval-export-site` regenerates it); porcelain status also catches new files.
      - run: uv run eval-export-site
      - run: test -z "$(git status --porcelain -- ../frontend/src/data/evals)" || { git status --short -- ../frontend/src/data/evals; exit 1; }

  # The regression gate (ADR 0012) checks committed evaluation reports against backend/eval/baseline.json. It
  # never calls a model, so it needs no API key. A workflow-level `paths:` filter would leave a required check
  # pending, so the job always runs and its first step decides whether anything it guards changed.
  eval-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # No usable base (a new branch, a manual run): check everything.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          guarded='^backend/(src/commitment_tracker/(extractor/|evaluation/|settings\.py)|eval/(sets/|reports/|baseline\.json))'
          if git diff --name-only "$BASE" HEAD | grep -Eq "$guarded"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "nothing the gate guards changed"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.run == 'true'
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - if: steps.changes.outputs.run == 'true'
        run: uv sync --locked
      - if: steps.changes.outputs.run == 'true'
        run: uv run eval-gate

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      # Biome lints and formats the frontend and infra together.
      - run: bunx biome ci .
      - run: bun run --cwd frontend typecheck
      - run: bun run --cwd frontend vitest
      # The repository's own tooling, such as the format-on-edit command.
      - run: bun test scripts
      # The typed client is generated from openapi.json; a stale one fails here.
      - run: bun run --cwd frontend gen:api
      - run: git diff --exit-code -- frontend/src/api/schema.d.ts

  # The browser test runs in its own job, in parallel with the checks above, inside Microsoft's Playwright image:
  # the browsers and their system libraries are already installed, so there is no apt step to slow it down.
  # Keep the tag equal to the @playwright/test version in bun.lock; a mismatch fails with "Executable doesn't exist".
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Not setup-bun: it unzips a download, and this image has no unzip. The npm package carries the same release.
      - run: npm install --global bun@1.4.2
      - run: bun install --frozen-lockfile
      # Builds the static site against a made-up API address, then runs the browser test on it.
      - run: bun run --cwd frontend e2e

  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      # The synth step builds the Lambda bundle with uv, which needs Python 3.12 (backend/.python-version).
      - run: uv python install 3.12
      - run: bun install --frozen-lockfile
      - run: bun --cwd infra test
      # A placeholder account pins the stacks, so no credentials are needed. The alert email turns on the
      # budget kill switch and the alarms, so they are synthesized too.
      - run: node node_modules/aws-cdk/bin/cdk synth --quiet -c alertEmail=ci@example.com
        working-directory: infra
        env:
          CDK_DEFAULT_ACCOUNT: '123456789012'

  # Live evaluation: disabled. It would run the configurations on the test set with a real API key; today those
  # runs happen locally and their reports are committed, which the eval-gate job checks. To enable it:
  #   - put ANTHROPIC_API_KEY in a protected GitHub environment with required reviewers, and set
  #     `environment:` on this job so every run waits for approval;
  #   - give that key a spend cap in the Anthropic console;
  #   - restore backend/eval/.cache between runs (actions/cache keyed on the sets and the prompt files), so a
  #     rerun only pays for what changed;
  #   - expect roughly $0.03-0.05 (haiku), $0.49-1.35 (sonnet), $0.98-2.70 (opus) and $0.90-2.45 (two-stage)
  #     per full run of the test set (docs/plans/part-3-evaluation.md, section 7);
  #   - then remove `if: false` and pass the key to the run step's environment.
  eval-live:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    strategy:
      matrix:
        config: [haiku, sonnet, opus, two-stage]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run eval --set test --config ${{ matrix.config }}
      # The reports come back as an artifact for a person to review and commit; the job never pushes.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-reports-${{ matrix.config }}
          path: backend/eval/reports/test/
