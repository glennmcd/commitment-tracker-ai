[project]
name = "commitment-tracker"
dynamic = ["version"]
description = "Extracts commitments from conversation transcripts and measures how well it does"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.1",
    "boto3>=1.43.117",
    "fastapi>=0.115",
    "mangum>=0.22.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dateutil>=2.9",
    "uvicorn>=0.32",
]

[project.scripts]
eval = "commitment_tracker.evaluation.cli:main"
eval-sets = "commitment_tracker.evaluation.sets:main"
export-openapi = "commitment_tracker.api.export_openapi:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-python-dateutil>=2.9",
    "httpx>=0.27",
    "types-boto3[dynamodb,lambda,s3,ssm,transcribe]>=1.43.117",
]
eval = [
    "scikit-learn>=1.5",
]

[tool.uv]
default-groups = ["dev", "eval"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/commitment_tracker/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/commitment_tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# scikit-learn ships without type information.
module = ["sklearn", "sklearn.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
